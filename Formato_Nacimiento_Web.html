<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formato Nacimiento - Embajada del Líbano</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, "Segoe UI", Tahoma, sans-serif;
    background: #666;
    margin: 0;
    padding: 24px;
  }
  .toolbar {
    max-width: 16.5cm;
    margin: 0 auto 16px auto;
    background: white;
    padding: 12px 16px;
    border-radius: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .toolbar h1 { font-size: 15px; margin: 0; color: #222; }
  .toolbar p { font-size: 12px; margin: 2px 0 0 0; color: #666; }
  .toolbar button {
    background: #8a1538; color: white; border: none; padding: 10px 16px;
    border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .toolbar button.secondary { background: #2b6cb0; }
  .toolbar button.add { background: #2f7a3d; }
  .toolbar button:hover { filter: brightness(1.1); }
  .toolbar label { font-size: 12px; color: #444; display:flex; align-items:center; gap:6px; }

  .page {
    position: relative;
    width: 16.5cm;
    height: 24.5cm;
    margin: 0 auto;
    background: white;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  .bg-ref {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    opacity: 0.55;
    pointer-events: none;
    user-select: none;
  }
  .field {
    position: absolute;
    display: flex;
    align-items: center;
    overflow: hidden;
    padding: 1px 2px;
  }
  .field-text {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
    outline: none;
    font-size: 11pt;
    line-height: 1.15;
    color: #000;
    white-space: normal;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  body.show-outlines .field {
    border: 1px dashed rgba(0,90,200,.55);
    background: rgba(0,120,255,0.05);
  }
  .field-text:focus {
    background: rgba(255,230,0,0.18);
  }

  .coord-tag {
    display: none;
    position: absolute;
    top: -16px; left: 0;
    font-size: 8px;
    background: #222;
    color: #fff;
    padding: 1px 3px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
  }
  .resize-handle {
    display: none;
    position: absolute;
    right: -4px; bottom: -4px;
    width: 10px; height: 10px;
    background: #d99500;
    border: 1px solid white;
    border-radius: 2px;
    cursor: nwse-resize;
    z-index: 6;
  }
  .del-handle {
    display: none;
    position: absolute;
    right: -6px; top: -6px;
    width: 14px; height: 14px;
    line-height: 12px;
    text-align: center;
    background: #c0392b;
    color: white;
    border: 1px solid white;
    border-radius: 50%;
    cursor: pointer;
    font-size: 11px;
    z-index: 7;
  }

  body.edit-mode .field {
    cursor: move;
    border: 1px solid rgba(217,149,0,.9) !important;
    background: rgba(217,149,0,0.08) !important;
  }
  body.edit-mode .field-text { pointer-events: none; }
  body.edit-mode .coord-tag { display: block; }
  body.edit-mode .resize-handle { display: block; }
  body.edit-mode .del-handle { display: flex; align-items:center; justify-content:center; }

  @media print {
    body { background: white; padding: 0; margin: 0; }
    .toolbar { display: none; }
    .bg-ref { display: none; }
    .page { box-shadow: none; margin: 0; }
    .field { border: none !important; background: transparent !important; }
    .coord-tag, .resize-handle, .del-handle { display: none !important; }
    @page { size: 16.5cm 24.5cm; margin: 0; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <div>
      <h1>Formato de Nacimiento — Embajada del Líbano en Bogotá</h1>
      <p>Modo normal: escribe sobre el formulario. Modo edición: arrastra, redimensiona, agrega o elimina casillas.</p>
    </div>
    <label><input type="checkbox" id="toggleOutlines" checked> Ver contornos</label>
    <label><input type="checkbox" id="toggleEdit"> Modo edición</label>
    <button class="add" onclick="addField()">+ Agregar casilla</button>
    <button class="secondary" onclick="exportCoords()">Descargar coordenadas</button>
    <button onclick="window.print()">Imprimir</button>
  </div>

<script>
const page = document.getElementById('page');
const PAGE_W_CM = 16.5;
const PAGE_H_CM = 24.5;
let fieldCounter = 0;

document.getElementById('toggleOutlines').addEventListener('change', function(e){
  document.body.classList.toggle('show-outlines', e.target.checked);
});
document.body.classList.add('show-outlines');

document.getElementById('toggleEdit').addEventListener('change', function(e){
  document.body.classList.toggle('edit-mode', e.target.checked);
  document.querySelectorAll('.field-text').forEach(function(el){
    el.setAttribute('contenteditable', e.target.checked ? 'false' : 'true');
  });
  if (e.target.checked) updateAllTags();
});

function pxToCm(px, axis) {
  const rect = page.getBoundingClientRect();
  return axis === 'x' ? (px / rect.width) * PAGE_W_CM : (px / rect.height) * PAGE_H_CM;
}

function updateTag(el) {
  const x = parseFloat(el.style.left);
  const y = parseFloat(el.style.top);
  const w = parseFloat(el.style.width);
  const h = parseFloat(el.style.height);
  const tag = el.querySelector('.coord-tag');
  tag.textContent = el.dataset.name + '  x:' + x.toFixed(2) + ' y:' + y.toFixed(2) +
                     ' w:' + w.toFixed(2) + ' h:' + h.toFixed(2);
}
function updateAllTags() {
  document.querySelectorAll('.field').forEach(updateTag);
}

function fitText(fieldEl, textEl) {
  textEl.style.fontSize = '11pt';
  let size = 11;
  const min = 5;
  while ((textEl.scrollWidth > fieldEl.clientWidth || textEl.scrollHeight > fieldEl.clientHeight) && size > min) {
    size -= 0.5;
    textEl.style.fontSize = size + 'pt';
  }
}

function setupField(el) {
  const textEl = el.querySelector('.field-text');
  textEl.addEventListener('input', function(){ fitText(el, textEl); });

  el.addEventListener('pointerdown', function(e){
    if (!document.body.classList.contains('edit-mode')) return;
    if (e.target.classList.contains('resize-handle') || e.target.classList.contains('del-handle')) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startLeft = parseFloat(el.style.left);
    const startTop = parseFloat(el.style.top);
    function onMove(ev) {
      const dxCm = pxToCm(ev.clientX - startX, 'x');
      const dyCm = pxToCm(ev.clientY - startY, 'y');
      el.style.left = Math.max(0, startLeft + dxCm).toFixed(2) + 'cm';
      el.style.top = Math.max(0, startTop + dyCm).toFixed(2) + 'cm';
      updateTag(el);
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  const handle = el.querySelector('.resize-handle');
  handle.addEventListener('pointerdown', function(e){
    if (!document.body.classList.contains('edit-mode')) return;
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const startW = parseFloat(el.style.width);
    const startH = parseFloat(el.style.height);
    function onMove(ev) {
      const dwCm = pxToCm(ev.clientX - startX, 'x');
      const dhCm = pxToCm(ev.clientY - startY, 'y');
      el.style.width = Math.max(0.3, startW + dwCm).toFixed(2) + 'cm';
      el.style.height = Math.max(0.3, startH + dhCm).toFixed(2) + 'cm';
      updateTag(el);
      fitText(el, textEl);
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  const del = el.querySelector('.del-handle');
  del.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    if (confirm('¿Eliminar la casilla "' + el.dataset.name + '"?')) {
      el.remove();
    }
  });
}

document.querySelectorAll('.field').forEach(setupField);

function addField() {
  const suggested = 'campo_nuevo_' + (++fieldCounter);
  const name = prompt('Nombre para la nueva casilla:', suggested);
  if (!name) { fieldCounter--; return; }
  const el = document.createElement('div');
  el.className = 'field';
  el.dataset.name = name;
  el.dataset.label = name;
  el.style.left = '1cm';
  el.style.top = '1cm';
  el.style.width = '2.5cm';
  el.style.height = '0.6cm';
  el.style.justifyContent = 'flex-start';
  el.innerHTML = '<div class="field-text" contenteditable="' +
    (document.body.classList.contains('edit-mode') ? 'false' : 'true') +
    '" dir="auto" style="text-align:start;"></div>' +
    '<span class="coord-tag"></span><span class="del-handle" title="Eliminar casilla">&times;</span><span class="resize-handle"></span>';
  page.appendChild(el);
  setupField(el);
  if (!document.body.classList.contains('edit-mode')) {
    document.getElementById('toggleEdit').checked = true;
    document.body.classList.add('edit-mode');
    document.querySelectorAll('.field-text').forEach(function(f){ f.setAttribute('contenteditable','false'); });
  }
  updateTag(el);
}

function exportCoords() {
  const data = [];
  document.querySelectorAll('.field').forEach(function(el){
    data.push({
      name: el.dataset.name,
      x: parseFloat(el.style.left).toFixed(2),
      y: parseFloat(el.style.top).toFixed(2),
      w: parseFloat(el.style.width).toFixed(2),
      h: parseFloat(el.style.height).toFixed(2)
    });
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'coordenadas_nacimiento.json';
  a.click();
  URL.revokeObjectURL(url);
}
